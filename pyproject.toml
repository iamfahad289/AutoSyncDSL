[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosyncdsl"
version = "0.1.0"
description = "An Embedded Python DSL for Multi-Sensor Timestamp Alignment and Batching in AV Perception Pipelines"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AutoSyncDSL Team"}
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "pytest>=6.2.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "pylint>=2.9.0",
]
docs = [
    "markdown>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100

[tool.setuptools]
packages = ["autosyncdsl", "loaders", "baselines", "experiments"]

